<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Core Computer Science and AI: Artificial Intelligence, Machine Learning, Deep Learning, Natural Language Processing, Large Language Models, Data Mining, Compiler Design, Computer Networks, Data Communication, Software Engineering, Database Management Systems, System Analysis and Design. Programming languages: C, C++, Java, Python, SQL. Web technologies: HTML5, CSS3, JavaScript, React.js, Node.js. Tools and platforms: GitHub, Jira, Canva, Gamma, Vercel, ElevenLabs, ChatGPT, Claude, Cursor, Antigravity, Windsurf, Qoder.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B33"/><stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#12345A" stop-opacity=".9"/><stop offset="1" stop-color="#12345A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tc-pulse">
      <stop offset="0" stop-color="#F2FBFF"/><stop offset=".5" stop-color="#55D6E8" stop-opacity=".6"/><stop offset="1" stop-color="#55D6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FBFF"/><stop offset=".45" stop-color="#55D6E8"/><stop offset="1" stop-color="#55D6E8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes tc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tc-panel { animation: none; }
      .tc-web { animation: none; stroke-dashoffset: 0; }
    }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tc-trace { display: none; } }
  </style>

  <rect width="1200" height="500" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#55D6E8" stroke-opacity=".16"/>

  <!-- Constellation: gutters linking the six groups -->
  <path class="tc-web" d="M24 250 H1176 M406 24 V476 M794 24 V476" fill="none" stroke="#55D6E8" stroke-opacity=".22"/>
  <circle cx="0" cy="250" r="8" fill="url(#tc-pulse)" opacity="0">
    <animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#07111F" stroke="#55D6E8">
    <rect x="400" y="244" width="12" height="12" transform="rotate(45 406 250)"/>
    <rect x="788" y="244" width="12" height="12" transform="rotate(45 794 250)"/>
  </g>

  <!-- Row 1 -->
  <g class="tc-panel tc-p1"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:0.00s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">01  AI · ML · LLM</text>
    <text class="tc-serif" x="24" y="82" font-size="27" font-weight="300" fill="#F2FBFF">Artificial Intelligence</text>
    <text class="tc-serif" x="24" y="122" font-size="26" font-weight="300" fill="#F2FBFF">Machine Learning</text>
    <text class="tc-serif" x="24" y="158" font-size="22" font-weight="300" fill="#B8F3FF">Deep Learning · NLP</text>
    <text class="tc-mono" x="24" y="186" font-size="12" letter-spacing="1" fill="#B8F3FF">LLMs · DATA MINING</text>
    
    
    
    
  </g></g>
  <g class="tc-panel tc-p2"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-1.15s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">02  CS FUNDAMENTALS</text>
    <text class="tc-serif" x="24" y="76" font-size="21" font-weight="300" fill="#F2FBFF">Compiler Design</text>
    <text class="tc-serif" x="24" y="108" font-size="21" font-weight="300" fill="#F2FBFF">Computer Networks</text>
    <text class="tc-serif" x="24" y="140" font-size="20" font-weight="300" fill="#F2FBFF">Data Communication</text>
    <text class="tc-serif" x="24" y="170" font-size="18" font-weight="300" fill="#B8F3FF">Software Engineering · DBMS</text>
    <text class="tc-mono" x="24" y="190" font-size="9.5" letter-spacing=".4" fill="#B8F3FF">SYSTEM ANALYSIS &amp; DESIGN</text>
    
    
    
    
    
  </g></g>
  <g class="tc-panel tc-p3"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-2.30s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">03  PROGRAMMING LANGUAGES</text>
    <text class="tc-serif" x="24" y="96" font-size="34" font-weight="300" fill="#F2FBFF">C · C++ · Java</text>
    <text class="tc-serif" x="24" y="146" font-size="34" font-weight="300" fill="#F2FBFF">Python</text>
    <text class="tc-serif" x="24" y="180" font-size="22" font-weight="300" fill="#B8F3FF">SQL</text>
    
    
    
    
  </g></g>

  <!-- Row 2 -->
  <g class="tc-panel tc-p4"><g transform="translate(32 268)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-3.45s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">04  WEB TECHNOLOGIES</text>
    <text class="tc-serif" x="24" y="90" font-size="30" font-weight="300" fill="#F2FBFF">HTML5 · CSS3</text>
    <text class="tc-serif" x="24" y="132" font-size="27" font-weight="300" fill="#F2FBFF">JavaScript</text>
    <text class="tc-serif" x="24" y="170" font-size="24" font-weight="300" fill="#B8F3FF">React.js · Node.js</text>
    
    
    
    
  </g></g>
  <g class="tc-panel tc-p5"><g transform="translate(420 268)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-4.60s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">05  TOOLS &amp; PLATFORMS</text>
    <text class="tc-serif" x="24" y="84" font-size="22" font-weight="300" fill="#F2FBFF">GitHub · Jira · Canva</text>
    <text class="tc-serif" x="24" y="120" font-size="23" font-weight="300" fill="#F2FBFF">Gamma · Vercel</text>
    <text class="tc-serif" x="24" y="156" font-size="22" font-weight="300" fill="#B8F3FF">ElevenLabs</text>
    <text class="tc-mono" x="24" y="184" font-size="10.5" letter-spacing="1" fill="#B8F3FF">DEVELOPMENT &amp; DESIGN</text>
    
    
    
    
    
  </g></g>
  <g class="tc-panel tc-p6"><g transform="translate(808 268)">
    <rect width="360" height="200" rx="14" fill="#0B1B33" fill-opacity=".85" stroke="#55D6E8" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-5.75s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#55D6E8">06  AI TOOLS &amp; ASSISTANTS</text>
    <text class="tc-serif" x="24" y="84" font-size="24" font-weight="300" fill="#F2FBFF">ChatGPT · Claude</text>
    <text class="tc-serif" x="24" y="122" font-size="24" font-weight="300" fill="#F2FBFF">Cursor · Antigravity</text>
    <text class="tc-serif" x="24" y="160" font-size="24" font-weight="300" fill="#B8F3FF">Windsurf · Qoder</text>
    
    
    
    
  </g></g>
</svg>
