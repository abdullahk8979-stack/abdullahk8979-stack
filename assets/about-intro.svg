  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ab-type { transform-box: fill-box; transform-origin: left center; animation-name: ab-type; animation-fill-mode: both; opacity: 0; }
    .ab-card { transform-box: fill-box; transform-origin: center; animation: ab-in 1.15s cubic-bezier(.22,1,.36,1) both; }
    .ab-fade { animation: ab-fade 1.25s cubic-bezier(.22,1,.36,1) both; }
    @keyframes ab-type { 0% { transform: scaleX(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: scaleX(1); opacity: 1; } }
    @keyframes ab-in { 0% { opacity: 0; transform: translate3d(18px, 5px, 0); } 70% { opacity: 1; } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes ab-fade { 0% { opacity: 0; } 100% { opacity: 1; } }
    .ab-panel-glow { animation: ab-glow 6s ease-in-out 1.5s infinite alternate; }
    @keyframes ab-glow { from { opacity: .12; } to { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .ab-type, .ab-card, .ab-fade, .ab-panel-glow { animation: none; opacity: 1; transform: none; } }
  </style>
